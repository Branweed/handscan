<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17614a">
<title>Manifest Check Office</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--field)}
.drop.over{border-color:var(--primary);background:var(--soft)}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.prow{display:grid;grid-template-columns:minmax(0,.4fr) minmax(0,.55fr) minmax(0,2.3fr) minmax(0,2.6fr) minmax(0,.7fr) minmax(0,.9fr) minmax(0,1.5fr) auto;gap:6px;align-items:center;padding:4px 0}
.prow .from{font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.sets{display:flex;flex-direction:column;gap:4px;margin:2px 0 10px;font-size:14px}
.sets .chip{margin-right:6px}
.addmore{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.addmore .meta{flex:1;min-width:220px}
.prow input{min-height:38px;font-size:14px;padding:0 8px}
.prow input.t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.prow input.badtag{border-color:var(--bad);background:var(--bad-bg)}
.prow.head{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.prow button{min-height:38px;width:38px;padding:0}
@media (max-width:760px){.prow{grid-template-columns:.4fr .6fr 1fr 1fr}.prow .t,.prow .it{grid-column:1/-1}.prow.head{display:none}.prow{border-top:1px solid var(--line);padding:10px 0}}
.stopcard>.grid2{margin:10px 0}
.warnlist{margin:8px 0 0;padding-left:20px;color:var(--warn);font-size:14px}
.oklist{margin:8px 0 0;color:var(--ok);font-size:14px;font-weight:700}
pre.raw{white-space:pre-wrap;font-size:12px;max-height:340px;overflow:auto;background:var(--field);border-radius:10px;padding:10px}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.res th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
.res-wrap{overflow-x:auto}
.mrow{display:flex;gap:12px;align-items:center;cursor:pointer}
.mrow.on{outline:2px solid var(--primary);border-radius:10px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap}
.truckname{font-size:18px;font-weight:900}
.inl{max-width:110px;min-height:36px;font-size:14px;text-transform:uppercase}
</style>
</head>
<body class="wide">
<header class="top">
  <h1>Manifest Check · Office</h1>
  <span class="who" id="who"></span>
  <button id="out" hidden>Sign out</button>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<script type="module">
import { DEMO, h, swap, uid, normalizeTag, looksLikeTag, fmtQty, fmtDate, fmtTime, summarize, tagNode, packageCount, stopIsDone, plural, downloadCsv,
  friendlyError, manifestNos, runTitle, crewNames, firstName, vehicleInfo, adminEmail, stopSets, stopManifestNos, setText, multiOrigin, boxLabel, ORIGINS } from "./shared.js";
import { createStore } from "./store.js";

const root = document.getElementById("app"), $ = id => document.getElementById(id);
const A = { store: null, user: undefined, profile: undefined, tab: "upload", admins: [], manifests: [], draft: null, busy: "", error: "",
  openId: null, openScans: [], showArchived: false, showRaw: false, newAdmin: null, trucksDb: [], unsub: {} };

(async () => {
  try { A.store = await createStore("admin"); }
  catch (e) { swap(root, h("div", { class: "card empty" }, "Couldn't load. Check your internet connection and reload.")); return; }
  A.store.onUser(u => {
    Object.values(A.unsub).forEach(f => f && f()); A.unsub = {};
    A.user = u || null; A.profile = undefined;
    if (u) A.unsub.p = A.store.watchProfile(u.uid, p => {
      const was = A.profile && A.profile.role; A.profile = p;
      if (p && p.role === "admin" && was !== "admin") {
        A.unsub.d = A.store.watchAdmins(l => { A.admins = l.sort((a, b) => String(a.name).localeCompare(String(b.name))); render(); }, onErr);
        A.unsub.m = A.store.watchAllManifests(l => { A.manifests = l; render(); }, onErr);
        A.unsub.t = A.store.watchTrucks(l => { A.trucksDb = l; render(); }, onErr);
      }
      render();
    }, onErr);
    render();
  });
  $("out").onclick = async () => { if (A.store.demo) { if (confirm("Reset the demo data?")) { A.store.reset(); A.draft = null; render(); } } else await A.store.signOut(); };
})();
function onErr(e) { console.warn(e); A.error = friendlyError(e); render(); }

/* ---------------- trucks ---------------- */
// Trucks come from the manifests' vehicle line (remembered by license plate), with the crews seen on them.
const truckCodes = () => [...new Set([...A.trucksDb.map(t => t.code), ...A.manifests.map(m => m.truck)].filter(Boolean))]
  .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
const truckList = () => h("datalist", { id: "trucklist" }, truckCodes().map(c => h("option", { value: c })));

/* ---------------- shell ---------------- */
function render() {
  $("who").textContent = A.profile ? A.profile.name || A.profile.email || "" : "";
  $("out").hidden = !A.user; $("out").textContent = A.store && A.store.demo ? "Reset demo" : "Sign out";
  if (A.user === undefined) return;
  if (!A.user) return swap(root, loginView());
  if (A.profile === undefined) return swap(root, h("div", { class: "empty" }, "Loading…"));
  if (!A.profile || A.profile.role !== "admin") return swap(root, h("div", { class: "card empty" },
    "This account isn't set up as an office admin. In the Firebase console, open Firestore → users → your user and set role to \"admin\". (See README step 5.)"));
  swap(root, h("div", null,
    A.store.demo ? h("div", { class: "banner" }, "Demo mode: data stays in this browser. Open the driver app (index.html) in another tab of this same browser to see runs you send. Add your Firebase config in shared.js to go live.") : null,
    A.error ? h("div", { class: "banner bad" }, A.error, h("button", { class: "small", onclick: () => { A.error = ""; render(); } }, "OK")) : null,
    h("div", { class: "tabs" }, [["upload", "Upload"], ["manifests", `Runs (${A.manifests.filter(m => m.status !== "archived").length})`], ["drivers", "Trucks & admins"]]
      .map(([k, t]) => h("button", { class: A.tab === k ? "on" : "", onclick: () => { A.tab = k; render(); } }, t))),
    A.tab === "upload" ? uploadView() : A.tab === "manifests" ? manifestsView() : driversView()));
}
function loginView() {
  const msg = h("div", { class: "err" });
  const user = h("input", { autocomplete: "username", placeholder: "Username (e.g. Brandon)", "data-k": "user", autocapitalize: "none", spellcheck: "false" });
  const pw = h("input", { type: "password", autocomplete: "current-password", placeholder: "Password", "data-k": "pw" });
  return h("form", { class: "card login", onsubmit: async e => {
      e.preventDefault();
      if (!user.value.trim() || !pw.value) { msg.textContent = "Enter your username and password."; return; }
      msg.textContent = "Signing in…";
      try { await A.store.signIn(adminEmail(user.value), pw.value); }
      catch (err) { msg.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(err.code || "") ? "That username or password isn't right." : friendlyError(err); }
    } }, h("h2", { class: "title" }, "Office sign in"), user, pw, h("button", { class: "primary big" }, "Sign in"), msg,
      h("a", { class: "back", href: "./", style: { marginTop: "8px" } }, "← Back to the trucks"));
}

/* ======================= upload + review ======================= */
function uploadView() {
  if (A.busy) return h("div", { class: "card empty" }, A.busy);
  if (A.draft) return draftView();
  const input = h("input", { type: "file", multiple: true, accept: ".pdf,.csv,.tsv,.txt,application/pdf,text/csv,text/plain", hidden: true, onchange: () => readFiles(input.files) });
  const drop = h("label", { class: "drop",
      ondragover: e => { e.preventDefault(); drop.classList.add("over"); }, ondragleave: () => drop.classList.remove("over"),
      ondrop: e => { e.preventDefault(); drop.classList.remove("over"); readFiles(e.dataTransfer.files); } },
    h("b", null, "Choose a truck's manifests and WTIs"), h("span", { class: "meta" }, "Select them all at once (PDF or CSV) · or drop them here"), input);
  return h("div", { class: "card" },
    h("h2", { class: "title", style: { marginTop: 0 } }, "Upload a run"),
    drop,
    h("div", { class: "btns", style: { marginTop: "12px" } },
      h("button", { onclick: () => { A.draft = blankDraft(); render(); } }, "Start a blank run instead")),
    h("p", { class: "meta" }, "Each Metrc manifest becomes a stop. WTIs are matched to their manifest by manifest number: they add box numbers and are checked tag by tag. You'll review everything and pick the truck before anything is sent."));
}
function blankDraft() {
  return { date: today(), truck: "", crew: [], source: "manual", files: [], warnings: [], rawText: "", transporters: [], vehicle: "",
    stops: [{ id: uid("s"), name: "", license: "", address: "", manifestNo: "", invoiceNo: "", packages: [blankPkg()] }] };
}
const blankPkg = () => ({ box: "", tag: "", item: "", qty: "", uom: "", batch: "" });
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

// add = true: more files for the run being checked (e.g. the Lakeville set after the Fall River one)
async function readFiles(list, add = false) {
  const files = [...(list || [])]; if (!files.length) return;
  const prev = add && A.draft && A.draft._results ? A.draft : null;
  A.busy = `Reading ${plural(files.length, "file")}…`; render();
  try {
    const P = await import("./manifest-parser.js");
    const results = prev ? [...prev._results] : [];
    for (const f of files) {
      const r = await P.parseManifestFile(f);
      if (results.some(x => x.fileName === r.fileName && x.manifestNo === r.manifestNo && x.invoiceNo === r.invoiceNo)) continue;   // same file twice
      results.push(r);
    }
    const run = P.combine(results);
    const vi = vehicleInfo(run.vehicle);
    const known = vi.plate && A.trucksDb.find(t => (t.plates || []).includes(vi.plate));
    A.draft = { ...run, _results: results, date: run.date || today(),
      truck: known ? known.code : vi.code, plate: vi.plate, nickname: vi.nickname,
      crew: run.transporters.map(t => ({ ...t, include: true })) };
    if (prev) {   // keep what was already chosen
      A.draft.date = prev.date || A.draft.date; A.draft.truck = prev.truck || A.draft.truck;
      for (const c of A.draft.crew) { const o = (prev.crew || []).find(x => (x.employeeId || x.name) === (c.employeeId || c.name)); if (o) c.include = o.include; }
    }
    if (!run.stops.length) A.draft.stops = blankDraft().stops;
  } catch (e) {
    console.error(e);
    A.error = /fetch|import|module/i.test(String(e && e.message)) ? "Couldn't load the PDF reader. Check your internet connection." : "Couldn't read that file: " + (e.message || e);
  }
  A.busy = ""; A.showRaw = false; render();
}

function draftView() {
  const d = A.draft;
  const total = d.stops.reduce((n, s) => n + s.packages.filter(p => p.tag).length, 0);
  const allTags = d.stops.flatMap(s => s.packages.map(p => normalizeTag(p.tag)).filter(Boolean));
  const dupTags = new Set(allTags.filter((t, i) => allTags.indexOf(t) !== i));
  const set = (obj, key) => e => { obj[key] = e.target.value; };
  const truck = String(d.truck || "").trim().toUpperCase(), going = (d.crew || []).filter(c => c.include);
  const crit = (d.warnings || []).filter(w => w.startsWith("⚠")), other = (d.warnings || []).filter(w => !w.startsWith("⚠"));
  const allSets = (d.stops || []).flatMap(s => s.sets || []);
  const checked = allSets.filter(x => x.invoiceNo && x.manifestNo).length;
  // Most orders have a Fall River and a Lakeville set; point out stops that came with only one
  const known = Object.values(ORIGINS).map(o => o.name);
  const single = (d.stops || []).filter(s => s.sets && s.sets.length === 1 && known.includes(s.sets[0].origin));
  const more = h("input", { type: "file", multiple: true, hidden: true, accept: ".pdf,.csv,.tsv,.txt,application/pdf,text/csv,text/plain", onchange: e => readFiles(e.target.files, true) });
  const sendLabel = truck ? `Send to ${truck}${going.length ? ` (${going.map(c => firstName(c.name)).join(" & ")})` : ""}` : "Type the truck name to send";
  return h("div", null,
    h("div", { class: "card" },
      h("div", { class: "rb" }, h("h2", { class: "title", style: { margin: 0 } }, "Check the run"),
        h("span", { class: "meta" }, d.files && d.files.length ? plural(d.files.length, "file") : "Typed in")),
      h("div", { class: "meta" }, `${plural(total, "package")} in ${plural(d.stops.length, "stop")}`),
      checked && !crit.length && d.source === "multiple" ? h("div", { class: "oklist" }, `✓ Every WTI matches its manifest, tag for tag (${plural(checked, "set")}).`) : null,
      crit.length ? h("ul", { class: "warnlist", style: { color: "var(--bad)", fontWeight: 700 } }, crit.map(w => h("li", null, w.replace(/^⚠\s*/, "")))) : null,
      other.length ? h("ul", { class: "warnlist" }, other.map(w => h("li", null, w))) : null,
      h("div", { class: "grid2", style: { marginTop: "12px" } },
        h("label", { class: "f" }, "Delivery date", h("input", { type: "date", "data-k": "d-date", value: d.date, oninput: set(d, "date") })),
),
      d._results ? h("div", { class: "addmore" },
        h("div", { class: "meta" }, single.length
          ? `Only one set found for ${single.map(s => `${s.name} (${s.sets[0].origin})`).join(", ")}. If ${single.length > 1 ? "there are" : "there's"} more for ${single.length > 1 ? "them" : "it"}, add the other manifest and WTI.`
          : "Every manifest for the same customer is combined into one stop."),
        h("label", { class: "btn small", style: { cursor: "pointer" }, title: "Adds files to this run. Changes typed below are reset." }, "+ Add more files", more)) : null),
    crewCard(d),
    d.stops.map((s, si) => h("div", { class: "card stopcard" },
      h("div", { class: "rb" }, h("b", null, `Stop ${si + 1}`),
        h("div", { class: "btns" },
          h("button", { class: "small", disabled: si === 0, title: "Move up", onclick: () => { move(d.stops, si, -1); render(); } }, "↑"),
          h("button", { class: "small", disabled: si === d.stops.length - 1, title: "Move down", onclick: () => { move(d.stops, si, 1); render(); } }, "↓"),
          h("button", { class: "small danger", onclick: () => { if (!s.packages.some(p => p.tag) || confirm(`Remove ${s.name || "this stop"} and its packages?`)) { d.stops.splice(si, 1); render(); } } }, "Remove stop"))),
      h("div", { class: "grid2" },
        h("label", { class: "f" }, "Stop name", h("input", { "data-k": `s-${s.id}-n`, value: s.name, oninput: set(s, "name"), placeholder: "e.g. Green Leaf Dispensary" })),
        h("label", { class: "f" }, "License", h("input", { "data-k": `s-${s.id}-l`, value: s.license, oninput: set(s, "license") })),
        h("label", { class: "f" }, "Address", h("input", { "data-k": `s-${s.id}-a`, value: s.address, oninput: set(s, "address") })),
        s.sets && s.sets.length ? null : h("label", { class: "f" }, "Metrc manifest #", h("input", { "data-k": `s-${s.id}-m`, value: s.manifestNo || "", oninput: set(s, "manifestNo") })),
        s.sets && s.sets.length ? null : h("label", { class: "f" }, "Invoice (WTI) #", h("input", { "data-k": `s-${s.id}-i`, value: s.invoiceNo || "", oninput: set(s, "invoiceNo") }))),
      s.sets && s.sets.length ? h("div", { class: "sets" }, s.sets.map(x => h("div", { class: "set" },
        x.originShort ? h("span", { class: "chip" }, x.originShort) : null, setText(x),
        x.invoiceNo ? null : h("span", { class: "chip warn", style: { marginLeft: "6px" } }, "no WTI")))) : null,
      h("div", { class: "prow head" }, ["From", "Box", "Metrc tag", "Item", "Qty", "Unit", "Batch", ""].map(x => h("div", null, x))),
      s.packages.map((p, pi) => {
        const nt = normalizeTag(p.tag), bad = p.tag && (!looksLikeTag(nt) || dupTags.has(nt));
        return h("div", { class: "prow" },
          h("div", { class: "from", title: p.origin || "" }, p.originShort || ""),
          h("input", { "data-k": `p-${s.id}-${pi}-x`, value: p.box || "", placeholder: "Box", oninput: set(p, "box") }),
          h("input", { class: "t" + (bad ? " badtag" : ""), "data-k": `p-${s.id}-${pi}-t`, value: p.tag, placeholder: "1A4…", title: bad ? (dupTags.has(nt) ? "This tag is listed twice" : "Doesn't look like a Metrc tag") : "",
            oninput: set(p, "tag"), onchange: () => render() }),
          h("input", { class: "it", "data-k": `p-${s.id}-${pi}-i`, value: p.item, placeholder: "Item name", oninput: set(p, "item") }),
          h("input", { "data-k": `p-${s.id}-${pi}-q`, value: p.qty, placeholder: "Qty", inputmode: "decimal", oninput: set(p, "qty") }),
          h("input", { "data-k": `p-${s.id}-${pi}-u`, value: p.uom, placeholder: "Each / Grams", oninput: set(p, "uom") }),
          h("input", { "data-k": `p-${s.id}-${pi}-b`, value: p.batch, placeholder: "Batch", oninput: set(p, "batch") }),
          h("button", { class: "danger", title: "Remove package", onclick: () => { s.packages.splice(pi, 1); render(); } }, "✕"));
      }),
      h("button", { class: "small", style: { marginTop: "8px" }, onclick: () => { s.packages.push(blankPkg()); render(); } }, "+ Add package"))),
    h("button", { onclick: () => { d.stops.push({ id: uid("s"), name: "", license: "", address: "", manifestNo: "", invoiceNo: "", packages: [blankPkg()] }); render(); } }, "+ Add stop"),
    d.rawText ? h("div", { class: "card", style: { marginTop: "14px" } },
      h("div", { class: "rb" }, h("b", null, "Text read from the files"),
        h("div", { class: "btns" },
          h("button", { class: "small", onclick: () => { A.showRaw = !A.showRaw; render(); } }, A.showRaw ? "Hide" : "Show"),
          h("button", { class: "small", onclick: e => { navigator.clipboard && navigator.clipboard.writeText(d.rawText).then(() => { e.target.textContent = "Copied"; }); } }, "Copy"))),
      h("div", { class: "meta" }, "If the reader got something wrong, copy this text so the reader can be adjusted."),
      A.showRaw ? h("pre", { class: "raw" }, d.rawText) : null) : null,
    h("div", { class: "sticky-actions" },
      h("button", { class: "primary", style: { flex: 1 }, disabled: !total || !truck, onclick: saveDraft }, sendLabel),
      h("button", { onclick: () => { if (confirm("Throw away this run?")) { A.draft = null; render(); } } }, "Discard")));
}
const move = (arr, i, dir) => { const [x] = arr.splice(i, 1); arr.splice(i + dir, 0, x); };

// The truck and the drivers named on the manifest. Drivers just pick the truck in the app: no logins.
function crewCard(d) {
  return h("div", { class: "card" },
    h("b", null, d.crew && d.crew.length ? "Truck & crew (from the manifest)" : "Truck"),
    h("div", { class: "grid2", style: { marginTop: "10px" } },
      h("label", { class: "f" }, "Truck", h("input", { "data-k": "d-truck", value: d.truck || "", placeholder: "e.g. W99", list: "trucklist", style: { textTransform: "uppercase" },
        oninput: e => { d.truck = e.target.value; }, onchange: () => render() }), truckList()),
      d.vehicle ? h("div", { class: "meta", style: { alignSelf: "end" } }, `Vehicle on manifest: ${d.vehicle}`) : null),
    (d.crew || []).map(c => h("div", { class: "pkg" },
      h("input", { type: "checkbox", checked: c.include, style: { width: "22px", minHeight: "22px", marginTop: "3px" }, onchange: e => { c.include = e.target.checked; render(); } }),
      h("div", { class: "main" }, h("div", { class: "name" }, c.name),
        h("div", { class: "meta" }, c.employeeId ? `Employee ID ${c.employeeId}` : "")))),
    h("div", { class: "hint" }, "Drivers open the app and pick this truck to see the run. No logins or passwords for drivers."));
}

async function saveDraft() {
  const d = A.draft;
  const truck = String(d.truck || "").trim().toUpperCase();
  if (!truck) { alert("Type the truck name first (e.g. W99)."); return; }
  const crew = (d.crew || []).filter(c => c.include);
  const stops = d.stops.map((s, i) => ({ id: s.id, name: s.name.trim() || `Stop ${i + 1}`, license: s.license.trim(), address: s.address.trim(),
    manifestNo: String(s.manifestNo || "").trim(), invoiceNo: String(s.invoiceNo || "").trim(),
    ...(s.sets && s.sets.length ? { sets: s.sets.map(x => ({ manifestNo: x.manifestNo || "", invoiceNo: x.invoiceNo || "", origin: x.origin || "", originShort: x.originShort || "", originLicense: x.originLicense || "" })) } : {}),
    packages: s.packages.map(p => ({ tag: normalizeTag(p.tag), item: p.item.trim(), qty: String(p.qty).trim(), uom: p.uom.trim(), batch: p.batch.trim(), box: String(p.box || "").trim(),
      ...(p.origin ? { origin: p.origin, originShort: p.originShort || "" } : {}), ...(p.manifestNo ? { manifestNo: p.manifestNo } : {}) })).filter(p => p.tag) }))
    .filter(s => s.packages.length);
  if (!stops.length) { alert("Add at least one package with a tag."); return; }
  const tags = stops.flatMap(s => s.packages.map(p => p.tag));
  const dups = [...new Set(tags.filter((t, i) => tags.indexOf(t) !== i))];
  if (dups.length) { alert(`These tags are listed more than once. Fix them first:\n${dups.join("\n")}`); return; }
  const odd = tags.filter(t => !looksLikeTag(t));
  if (odd.length && !confirm(`${plural(odd.length, "tag")} don't look like Metrc tags (24 characters starting with 1A). Send anyway?`)) return;
  const nos = stops.flatMap(stopManifestNos);
  const clash = A.manifests.filter(m => m.status !== "archived" && manifestNos(m).some(n => nos.includes(n)));
  if (clash.length && !confirm(`Manifest ${clash.flatMap(manifestNos).filter(n => nos.includes(n)).join(", ")} was already sent (${clash.map(runTitle).join(", ")}). Send another copy?`)) return;
  const m = { date: d.date || today(), truck, driverIds: [], driverNames: crew.map(c => c.name), status: "assigned", stops, stopsDone: {},
    createdAt: Date.now(), updatedAt: Date.now(), source: d.source || "manual", files: d.files || [] };
  m.title = [m.truck, fmtDate(m.date)].filter(Boolean).join(" · ");
  A.busy = "Sending…"; render();
  try {
    if (d.plate || d.nickname || crew.length) await A.store.saveTruck(truck, { plate: d.plate, nickname: d.nickname, crew: crew.map(c => ({ name: c.name, employeeId: c.employeeId || "" })) });
    const id = await A.store.saveManifest(m);
    A.draft = null; A.tab = "manifests"; openManifest(id);
  } catch (e) { A.error = friendlyError(e); }
  A.busy = ""; render();
}

/* ======================= runs + results ======================= */
function openManifest(id) {
  A.unsub.sc && A.unsub.sc(); A.openId = id; A.openScans = [];
  if (id) A.unsub.sc = A.store.watchScans(id, l => { A.openScans = l; render(); }, onErr);
  render();
}
const statusChip = m => m.status === "archived" ? h("span", { class: "chip" }, "Archived") : m.status === "done" ? h("span", { class: "chip ok" }, "Done")
  : m.status === "in_progress" ? h("span", { class: "chip warn" }, "In progress") : h("span", { class: "chip" }, "Sent");
function manifestsView() {
  const list = A.manifests.filter(m => A.showArchived || m.status !== "archived");
  const open = A.manifests.find(m => m.id === A.openId);
  return h("div", null,
    open ? detailView(open) : null,
    h("div", { class: "card" },
      h("div", { class: "rb" }, h("b", null, "All runs"),
        h("label", { class: "meta", style: { display: "flex", gap: "6px", alignItems: "center" } },
          h("input", { type: "checkbox", style: { width: "18px", minHeight: "18px" }, checked: A.showArchived, onchange: e => { A.showArchived = e.target.checked; render(); } }), "Show archived")),
      list.length ? list.map(m => {
        const stops = (m.stops || []).length, done = (m.stops || []).filter(s => stopIsDone(m, s.id)).length;
        return h("div", { class: "pkg mrow" + (m.id === A.openId ? " on" : ""), onclick: () => { openManifest(m.id); scrollTo({ top: 0, behavior: "smooth" }); } },
          h("div", { class: "ic" }, m.status === "done" ? "✓" : ""),
          h("div", { class: "main" },
            h("div", { class: "rb" }, h("b", null, runTitle(m)), statusChip(m)),
            h("div", { class: "meta" }, [crewNames(m), plural(packageCount(m), "package"), `${done}/${stops} stops finished`].filter(Boolean).join(" · ")),
            manifestNos(m).length ? h("div", { class: "meta" }, `Manifests ${manifestNos(m).join(", ")}`) : null));
      }) : h("div", { class: "empty" }, "Nothing here yet. Upload a run to get started.")));
}

function detailView(m) {
  const sum = summarize(m, A.openScans);
  const issuesAll = (m.stops || []).flatMap(s => sum.per[s.id].issues).length;
  return h("div", { class: "card" },
    h("div", { class: "rb" }, h("h2", { class: "title", style: { margin: 0 } }, runTitle(m)),
      h("button", { class: "small ghost", onclick: () => openManifest(null) }, "Close")),
    h("div", { class: "meta" }, [crewNames(m), manifestNos(m).length && `Manifests ${manifestNos(m).join(", ")}`].filter(Boolean).join(" · ")),
    h("div", { class: "rb", style: { marginTop: "8px" } }, h("b", null, `${sum.done} of ${plural(sum.total, "package")} scanned`),
      issuesAll ? h("span", { class: "chip bad" }, plural(issuesAll, "problem scan")) : statusChip(m)),
    h("div", { class: "bar" }, h("i", { style: { width: `${sum.total ? (sum.done / sum.total) * 100 : 0}%` } })),
    h("div", { class: "grid2", style: { marginTop: "12px" } },
      h("label", { class: "f" }, "Truck", h("input", { value: m.truck || "", list: "trucklist", style: { textTransform: "uppercase" }, onchange: async e => {
          const t = e.target.value.trim().toUpperCase(); if (!t || t === m.truck) return;
          if (!confirm(`Move this run to truck ${t}?`)) { e.target.value = m.truck || ""; return; }
          try { await A.store.updateManifest(m.id, { truck: t, title: [t, fmtDate(m.date)].filter(Boolean).join(" · ") }); } catch (err) { onErr(err); }
        } }), truckList())),
    h("div", { class: "btns", style: { marginTop: "12px" } },
      h("button", { class: "small", onclick: () => exportResults(m, sum) }, "Export results (CSV)"),
      h("button", { class: "small", onclick: () => A.store.updateManifest(m.id, { status: m.status === "archived" ? (Object.values(m.stopsDone || {}).some(Boolean) ? "in_progress" : "assigned") : "archived" }).catch(onErr) },
        m.status === "archived" ? "Unarchive" : "Archive"),
      h("button", { class: "small danger", onclick: async () => {
        if (!confirm(`Delete ${runTitle(m)} and all its scan results? This can't be undone.`)) return;
        try { await A.store.deleteManifest(m.id); openManifest(null); } catch (err) { onErr(err); }
      } }, "Delete")),
    (m.stops || []).map((s, i) => {
      const p = sum.per[s.id], fin = m.stopsDone && m.stopsDone[s.id];
      const issues = [...new Map(p.issues.map(x => [x.tag + x.result, x])).values()];
      const who = sc => [fmtTime(sc.at), sc.driverName && firstName(sc.driverName)].filter(Boolean).join(" · ");
      return h("div", { style: { marginTop: "18px" } },
        h("div", { class: "rb" }, h("b", null, `${i + 1}. ${s.name}`),
          fin ? h("span", { class: fin.missing && fin.missing.length ? "chip warn" : "chip ok" }, `Finished ${fmtTime(fin.at)}${fin.missing && fin.missing.length ? ` · ${fin.missing.length} missing` : ""}`)
            : h("span", { class: "chip" }, `${p.matched.size}/${s.packages.length}`)),
        stopSets(s).map(x => h("div", { class: "meta" }, setText(x))),
        h("div", { class: "meta" }, [s.license, s.address].filter(Boolean).join(" · ")),
        p.matched.size ? h("button", { class: "small", style: { margin: "6px 0 2px" }, onclick: async e => {
          const btn = e.currentTarget, tags = s.packages.filter(pk => p.matched.has(pk.tag)).map(pk => pk.tag);
          try { await navigator.clipboard.writeText(tags.join("\n")); btn.textContent = `✓ Copied ${plural(tags.length, "tag")}`; }
          catch (err) { btn.textContent = "Couldn't copy"; }
          setTimeout(() => { btn.textContent = `Copy scanned tags (${tags.length})`; }, 1800);
        } }, `Copy scanned tags (${p.matched.size})`) : null,
        h("div", { class: "res-wrap" }, h("table", { class: "res" },
          h("tr", null, ["", "Box", "Item", "Qty", "Batch", "Tag", "Scanned"].map(x => h("th", null, x))),
          s.packages.map(pk => { const sc = p.matched.get(pk.tag);
            return h("tr", null, h("td", null, sc ? h("span", { class: "chip ok" }, "✓") : fin ? h("span", { class: "chip bad" }, "Missing") : h("span", { class: "chip" }, "—")),
              h("td", null, multiOrigin(s) && pk.originShort ? `${pk.originShort} ${pk.box || ""}` : pk.box || ""), h("td", null, pk.item), h("td", null, fmtQty(pk)), h("td", null, pk.batch), h("td", null, tagNode(pk.tag)), h("td", { class: "meta" }, sc ? who(sc) : "")); }),
          issues.map(x => h("tr", null, h("td", null, h("span", { class: "chip bad" }, "!")), h("td"),
            h("td", { colspan: "3" }, x.result === "wrong_stop" ? `Scanned here, but belongs to stop ${m.stops.findIndex(q => q.id === x.otherStopId) + 1}` : "Scanned here, not on this run"),
            h("td", null, tagNode(x.tag)), h("td", { class: "meta" }, who(x)))))));
    }));
}
function exportResults(m, sum) {
  const rows = [["Run", "Date", "Truck", "Drivers", "Stop #", "Stop", "License", "From", "Manifest #", "WTI #", "Box", "Tag", "Item", "Qty", "Unit", "Batch", "Result", "Scanned at", "Scanned by", "Stop finished at"]];
  (m.stops || []).forEach((s, i) => {
    const p = sum.per[s.id], fin = m.stopsDone && m.stopsDone[s.id];
    const base = [runTitle(m), m.date, m.truck || "", crewNames(m), i + 1, s.name, s.license];
    const sets = stopSets(s), setOf = pk => sets.find(x => pk.manifestNo && String(x.manifestNo).replace(/^0+/, "") === String(pk.manifestNo).replace(/^0+/, "")) || (sets.length === 1 ? sets[0] : {});
    for (const pk of s.packages) { const sc = p.matched.get(pk.tag), st = setOf(pk);
      rows.push([...base, pk.origin || st.origin || "", pk.manifestNo || st.manifestNo || "", st.invoiceNo || "", pk.box || "", pk.tag, pk.item, pk.qty, pk.uom, pk.batch, sc ? "Scanned" : fin ? "Missing" : "Not scanned yet",
        sc ? new Date(sc.at).toLocaleString() : "", sc ? sc.driverName || "" : "", fin ? new Date(fin.at).toLocaleString() : ""]); }
    for (const x of p.issues) rows.push([...base, "", "", "", "", x.tag, "", "", "", "", x.result === "wrong_stop" ? "Wrong stop" : "Not on run",
      new Date(x.at).toLocaleString(), x.driverName || "", ""]);
  });
  downloadCsv(`${(runTitle(m) || "run").replace(/[^\w-]+/g, "-")}-results.csv`, rows);
}

/* ======================= trucks + admins ======================= */
function driversView() {
  const f = A.newAdmin ||= { name: "", username: "", password: "" };
  const msg = h("div", { class: "err" });
  const codes = truckCodes();
  return h("div", null,
    h("div", { class: "card" },
      h("h2", { class: "title", style: { marginTop: 0 } }, "Trucks"),
      h("p", { class: "meta", style: { marginTop: 0 } }, "Drivers open the app and tap their truck. No passwords. Trucks and crews are picked up from the manifests you upload."),
      codes.length ? codes.map(c => {
        const t = A.trucksDb.find(x => x.code === c) || {}, runs = A.manifests.filter(m => m.truck === c && m.status !== "archived").length;
        return h("div", { class: "pkg" },
          h("div", { class: "ic", style: { width: "44px", borderRadius: "10px", fontSize: "13px" } }, c),
          h("div", { class: "main" },
            h("div", { class: "name" }, [t.nickname, (t.plates || []).length && `plate ${t.plates.join(", ")}`].filter(Boolean).join(" · ") || c),
            h("div", { class: "meta" }, (t.crew || []).length ? `Crew: ${t.crew.map(x => x.name).join(", ")}` : "No crew seen yet")),
          h("span", { class: "chip" }, plural(runs, "run")));
      }) : h("div", { class: "empty" }, "No trucks yet. They appear after you send the first run.")),
    h("div", { class: "card" },
      h("h2", { class: "title", style: { marginTop: 0 } }, "Office admins"),
      A.admins.map(x => h("div", { class: "pkg" },
        h("div", { class: "ic" }, (x.name || "?")[0].toUpperCase()),
        h("div", { class: "main" }, h("div", { class: "name" }, x.name || "(no name)"),
          h("div", { class: "meta" }, x.username ? `Username: ${x.username}` : x.email || "")),
        x.id === (A.user && A.user.uid) ? h("span", { class: "chip ok" }, "You") : null))),
    h("form", { class: "card", onsubmit: async e => {
        e.preventDefault();
        const un = f.username.trim();
        if (!f.name.trim() || !un) { msg.textContent = "Enter a name and a username."; return; }
        if (/[^A-Za-z0-9._-]/.test(un)) { msg.textContent = "Usernames can use letters, numbers, dots, dashes and underscores (no spaces)."; return; }
        if (f.password.length < 6) { msg.textContent = "The password needs at least 6 characters."; return; }
        msg.textContent = "Adding…";
        try { await A.store.addAdmin({ name: f.name.trim(), username: un, password: f.password }); A.newAdmin = null; render(); }
        catch (err) { msg.textContent = /email-already-in-use/.test(err.code || "") ? "That username is already taken." : friendlyError(err); }
      } },
      h("h2", { class: "title", style: { marginTop: 0 } }, "Add an admin"),
      h("div", { class: "grid2" },
        h("label", { class: "f" }, "Name", h("input", { "data-k": "na-n", value: f.name, oninput: e => { f.name = e.target.value; }, placeholder: "e.g. Robert Dessert" })),
        h("label", { class: "f" }, "Username", h("input", { "data-k": "na-u", value: f.username, autocapitalize: "none", spellcheck: "false", oninput: e => { f.username = e.target.value; }, placeholder: "e.g. RJ" })),
        h("label", { class: "f" }, "Password", h("input", { type: "password", "data-k": "na-p", value: f.password, autocomplete: "new-password", oninput: e => { f.password = e.target.value; } }))),
      h("div", { class: "btns", style: { marginTop: "12px" } }, h("button", { class: "primary" }, "Add admin")), msg,
      h("p", { class: "meta" }, "They sign in to this office page with that username and password. Usernames aren't case-sensitive.")));
}
</script>
