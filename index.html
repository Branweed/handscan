<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17614a">
<title>Manifest Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
// Chrome's "Desktop site" mode lays pages out ~980px wide on a phone, so everything looks tiny.
// On touch phones, zoom the page back to the phone's real width.
(function () {
  function fit() {
    try {
      var d = document.documentElement, sw = screen.width, small = Math.min(screen.width, screen.height) <= 600;
      var touch = navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
      d.style.zoom = "";
      var w = window.innerWidth;
      if (touch && small && sw > 0 && w > sw * 1.25) d.style.zoom = (w / sw).toFixed(3);
    } catch (e) {}
  }
  fit(); addEventListener("orientationchange", function () { setTimeout(fit, 300); });
})();
</script>
</head>
<body>
<header class="top">
  <h1>Manifest Check</h1>
  <span class="pill" id="sync">…</span>
  <button id="menu" hidden>Sign out</button>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<script type="module">
import { DEMO, h, swap, normalizeTag, fmtQty, fmtDate, fmtTime, summarize, tagNode, packageCount, stopIsDone, RESULT, plural, friendlyError,
  runTitle, manifestNos, crewNames, firstName, stopSets, setText, multiOrigin, boxLabel, KNOWN_TRUCKS, mergeCrew, personKey, whoKey, LOAD, loadSummary } from "./shared.js";
import { createStore } from "./store.js";
import { scanMany, signal } from "./barcode-scanner.js";

const root = document.getElementById("app"), $ = id => document.getElementById(id);
// Formats Metrc tags and company labels are printed in. QR codes are read even if they hold a URL around the tag.
const FORMATS = ["code_128", "qr_code", "data_matrix", "code_39", "pdf417"];
const S = { store: null, driver: undefined, trucks: [], driverNames: null, locked: false, me: null,
  si: { active: false, name: "", secret: "", msg: "" }, np: { active: false, first: false, p1: "", p2: "", msg: "" }, pick: "", pickName: "", manifests: [], error: "",
  mid: null, manifest: undefined, scans: [], pending: 0, local: new Map(), last: null, code: "", unsub: {} };

/* ---------------- start up ---------------- */
// No accounts for drivers: the phone remembers which truck (and, optionally, who) it is.
const DKEY = "handscan:driver";
const loadDriver = () => { try { return JSON.parse(localStorage.getItem(DKEY)) || null; } catch (e) { return null; } };
const saveDriver = d => { try { d ? localStorage.setItem(DKEY, JSON.stringify(d)) : localStorage.removeItem(DKEY); } catch (e) {} };
const crewCount = m => (m.driverNames || []).length;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  try { S.store = await createStore("driver"); await S.store.ready(); S.me = (await S.store.myDevice()) || (S.store.myAdmin ? await S.store.myAdmin() : null); if (S.me) S.pickName = S.me.name || "";
    if (S.me && !S.me.admin && S.me.code && !S.me.pin) S.np = { active: true, first: true, p1: "", p2: "", msg: "" };   // signed in with the company PIN but never made their own
  }
  catch (e) { swap(root, h("div", { class: "card empty" }, "Couldn't start the app. Connect to the internet once and reload — after that it works offline.")); return; }
  startWatching();
  const saved = loadDriver();
  if (saved) { S.pickName = saved.name || ""; S.lastTruck = saved.truck || ""; }
  // Opening the app always starts on the truck buttons. Only a link straight into a run (e.g. a reload mid-stop) skips them.
  setDriver(!onPicker() && saved && saved.truck ? saved : null);
  addEventListener("hashchange", () => { followRoute(); render(); scrollTo(0, 0); });
  addEventListener("online", render); addEventListener("offline", render);
  $("menu").onclick = () => { location.hash = ""; };   // back to "Who are you? / Which truck?" (scans waiting to upload still upload)
})();
function setDriver(d) {
  ["list", "m", "sc"].forEach(k => { S.unsub[k] && S.unsub[k](); S.unsub[k] = null; });
  Object.assign(S, { driver: d && d.truck ? d : null, manifests: [], mid: null, manifest: undefined, scans: [], pending: 0, local: new Map(), last: null });
  if (S.driver) { saveDriver(S.driver); S.lastTruck = S.driver.truck; S.pickName = S.driver.name || S.pickName; }
  if (S.driver) { S.unsub.list = S.store.watchTruckRuns(S.driver.truck, l => { S.manifests = l; render(); }, onErr); followRoute(); }
  render();
}
function onErr(e) { if (isLockedErr(e)) return lockPhone(); console.warn(e); S.error = friendlyError(e); render(); }

/* ---------------- this phone's access: approved once with the company code ---------------- */
const isLockedErr = e => !!e && (e.code === "permission-denied" || /permission/i.test(e.message || ""));
function lockPhone() { if (!S.locked) { S.locked = true; S.me = null; render(); } }
function startWatching() {
  ["trucks", "names"].forEach(k => { S.unsub[k] && S.unsub[k](); S.unsub[k] = null; });
  S.unsub.trucks = S.store.watchTrucks(l => { S.trucks = l.filter(t => !String(t.id || "").startsWith("_")); S.locked = false; if (!S.driver) render(); }, e => isLockedErr(e) ? lockPhone() : console.warn(e));
  S.unsub.names = S.store.watchDriverNames(n => { S.driverNames = n; if (onPicker()) render(); }, () => {});
}
/* ---------------- driver sign-in: own PIN (first time: the company PIN, then pick their own) ---------------- */
const busy = msg => msg === "Checking…" || msg === "Saving…";
async function doSignIn(e) {
  e.preventDefault();
  const name = S.si.name, secret = S.si.secret.trim();
  if (!name) { S.si.msg = "Pick your name first."; return render(); }
  if (!/^\d{4,8}$/.test(secret)) { S.si.msg = "Type your PIN (first time: the company PIN)."; return render(); }
  if (!navigator.onLine) { S.si.msg = "Connect to the internet to sign in."; return render(); }
  S.si.msg = "Checking…"; render();
  try {
    const how = await Promise.race([S.store.driverSignIn(whoKey(name), name, secret), new Promise((_, rej) => setTimeout(() => rej(new Error("slow")), 20000))]);
    S.me = { who: whoKey(name), name, ...(how === "code" ? { code: secret } : {}) }; S.pickName = name;
    S.si = { active: false, name: "", secret: "", msg: "" };
    if (how === "code") S.np = { active: true, first: true, p1: "", p2: "", msg: "" };
    S.locked = false; S.error = ""; startWatching(); setDriver(null); location.hash = "";
  } catch (err) {
    S.si.msg = err.code === "setup" ? err.message : isLockedErr(err) ? `That isn't ${firstName(name)}'s PIN. First time? Use the company PIN. Forgot yours? Ask the office to reset it.`
      : err.message === "slow" ? "No answer — check your signal and try again." : friendlyError(err);
    render();
  }
}
function signInView() {
  const names = mergeCrew((S.driverNames || []).map(name => ({ name }))).map(c => c.name).sort((a, b) => a.localeCompare(b));
  return h("div", { class: "pick" },
    h("div", { class: "card lockcard" },
      h("div", { class: "lockic" }, "🔒"),
      h("h2", { class: "pick-q", style: { marginTop: "4px" } }, "Sign in"),
      h("form", { onsubmit: doSignIn, style: { textAlign: "left" } },
        h("label", { class: "f pick-name" }, "Who are you?",
          h("select", { class: "namesel", "data-k": "siname", onchange: e => { S.si.name = e.target.value; S.si.msg = ""; render(); } },
            h("option", { value: "", selected: !S.si.name }, names.length ? "Choose your name…" : "No names yet — ask the office"),
            names.map(n => h("option", { value: n, selected: n === S.si.name }, n)))),
        h("label", { class: "f pick-name", style: { marginTop: "14px" } }, "PIN",
          h("input", { "data-k": "sipin", type: "password", inputmode: "numeric", autocomplete: "off", value: S.si.secret, class: "codein", placeholder: "••••",
            oninput: e => { S.si.secret = e.target.value; } })),
        h("div", { class: "hint" }, "First time? Type the company PIN. Then you'll pick your own."),
        h("button", { class: "primary big", style: { marginTop: "14px" }, disabled: busy(S.si.msg) }, "Sign in")),
      S.si.msg ? h("div", { class: busy(S.si.msg) ? "hint" : "err", style: { marginTop: "10px" } }, S.si.msg) : null,
      S.si.active && !S.locked ? h("button", { type: "button", class: "linkbtn", onclick: () => { S.si = { active: false, name: "", secret: "", msg: "" }; render(); } }, "Cancel") : null),
    h("div", { class: "pick-sep" }),
    h("a", { class: "btn big office", href: "admin.html#office" }, "🔒  Office / Admin"));
}
async function doSavePin(e) {
  e.preventDefault();
  const { p1, p2 } = S.np;
  if (!/^\d{4,6}$/.test(p1)) { S.np.msg = "Use 4 to 6 numbers."; return render(); }
  if (S.me && S.me.code && p1 === String(S.me.code)) { S.np.msg = "Pick a PIN that's different from the company PIN."; return render(); }
  if (p1 !== p2) { S.np.msg = "The two PINs don't match. Type them again."; S.np.p2 = ""; return render(); }
  if (!navigator.onLine) { S.np.msg = "Connect to the internet to save your PIN."; return render(); }
  S.np.msg = "Saving…"; render();
  try {
    await S.store.savePin(S.me.who, S.me.name, p1);
    S.np = { active: false, first: false, p1: "", p2: "", msg: "" }; delete S.me.code; S.me.pin = true;
    S.pinSaved = true; render(); setTimeout(() => { S.pinSaved = false; render(); }, 4000);
  } catch (err) { S.np.msg = isLockedErr(err) ? "Couldn't save it. Sign in again and retry." : friendlyError(err); render(); }
}
function pinView() {
  const first = S.np.first;
  return h("div", { class: "pick" },
    h("div", { class: "card lockcard" },
      h("div", { class: "lockic" }, "🔑"),
      h("h2", { class: "pick-q", style: { marginTop: "4px" } }, first ? `Welcome, ${firstName(S.me.name)}! Pick your own PIN` : "Change your PIN"),
      h("p", { class: "meta", style: { marginTop: 0 } }, first ? "4 to 6 numbers. Use it to sign in from now on — the company PIN won't work for you anymore." : "4 to 6 numbers."),
      h("form", { onsubmit: doSavePin, style: { textAlign: "left" } },
        h("label", { class: "f pick-name" }, first ? "New PIN" : "New PIN",
          h("input", { "data-k": "p1", type: "password", inputmode: "numeric", autocomplete: "new-password", class: "codein", value: S.np.p1, oninput: e => { S.np.p1 = e.target.value; } })),
        h("label", { class: "f pick-name", style: { marginTop: "12px" } }, "Type it again",
          h("input", { "data-k": "p2", type: "password", inputmode: "numeric", autocomplete: "new-password", class: "codein", value: S.np.p2, oninput: e => { S.np.p2 = e.target.value; } })),
        h("button", { class: "primary big", style: { marginTop: "14px" }, disabled: busy(S.np.msg) }, "Save my PIN")),
      S.np.msg ? h("div", { class: busy(S.np.msg) ? "hint" : "err", style: { marginTop: "10px" } }, S.np.msg) : null,
      first ? null : h("button", { type: "button", class: "linkbtn", onclick: () => { S.np = { active: false, first: false, p1: "", p2: "", msg: "" }; render(); } }, "Cancel")));
}
// No hash = the first screen (name + truck). "#/" = that truck's runs, "#/m/…" = a run.
const onPicker = () => !location.hash || location.hash === "#";
function route() {
  const m = location.hash.match(/^#\/m\/([^/]+)(?:\/s\/([^/]+))?/);
  return m ? { mid: decodeURIComponent(m[1]), sid: m[2] ? decodeURIComponent(m[2]) : null } : {};
}
function followRoute() {
  const { mid } = route();
  if ((mid || null) === S.mid) return;
  S.unsub.m && S.unsub.m(); S.unsub.sc && S.unsub.sc();
  Object.assign(S, { mid: mid || null, manifest: undefined, scans: [], pending: 0, local: new Map(), last: null });
  if (!mid || !S.driver) return;
  S.unsub.m = S.store.watchManifest(mid, m => { S.manifest = m; render(); }, onErr);
  S.unsub.sc = S.store.watchScans(mid, (l, p) => { S.scans = l; S.pending = p; render(); }, onErr);
}

/* ---------------- render ---------------- */
function render() {
  const sync = $("sync");
  if (!navigator.onLine) { sync.className = "pill off"; sync.textContent = S.pending ? `Offline · ${S.pending} saved on phone` : "Offline"; }
  else { sync.className = "pill"; sync.textContent = S.pending ? `Uploading ${S.pending}…` : DEMO ? "Demo" : "Online"; }
  $("menu").hidden = !S.driver;
  $("menu").textContent = "Trucks";
  if (S.driver === undefined) return;
  if (S.np.active && S.me) { $("menu").hidden = true; return swap(root, pinView()); }
  if (S.locked || S.si.active) { $("menu").hidden = true; return swap(root, signInView()); }
  if (!S.driver || onPicker()) { $("menu").hidden = true; return swap(root, loginView()); }
  swap(root, h("div", null,
    S.store.demo ? h("div", { class: "banner" }, "Demo mode: data stays on this device. Tap a package to pretend-scan it. ",
      h("button", { class: "small", onclick: () => { if (confirm("Reset the demo data?")) { S.store.reset(); location.hash = ""; } } }, "Reset demo")) : null,
    S.error ? h("div", { class: "banner bad" }, S.error, h("button", { class: "small", onclick: () => { S.error = ""; render(); } }, "OK")) : null,
    body()));
}
function body() {
  const r = route();
  if (!r.mid) return listView();
  if (S.manifest === undefined) return h("div", { class: "empty" }, "Loading…");
  if (S.manifest === null) return h("div", null, h("a", { class: "back", href: "#/" }, "← All runs"),
    h("div", { class: "card empty" }, "This run isn't on this phone. Connect to the internet and open it again."));
  if (r.sid === LOAD) return loadView();
  const stop = r.sid && (S.manifest.stops || []).find(s => s.id === r.sid);
  return stop ? stopView(stop) : manifestView();
}

/* ---------------- first screen: tap your truck (no password), office button underneath ---------------- */
function loginView() {
  const byCode = new Map(KNOWN_TRUCKS.map(t => [t.code, { ...t }]));
  for (const t of S.trucks) { const k = byCode.get(t.code) || {}; byCode.set(t.code, { ...k, ...t, crew: mergeCrew([...(k.crew || []), ...(t.crew || [])]) }); }
  const order = c => { const i = KNOWN_TRUCKS.findIndex(t => t.code === c); return i < 0 ? 99 : i; };
  const trucks = [...byCode.values()].sort((a, b) => order(a.code) - order(b.code) || String(a.code).localeCompare(String(b.code), undefined, { numeric: true }));
  // picking a truck is a new screen, so the phone's Back button returns here
  const start = code => { const c = String(code || "").trim().toUpperCase(); if (!c) return; setDriver({ truck: c, name: (S.me ? S.me.name : S.pickName).trim() }); location.hash = "#/"; };
  // one plain A–Z list of every driver; which truck they're in today is picked separately below
  const source = S.driverNames && S.driverNames.length ? S.driverNames.map(name => ({ name })) : trucks.flatMap(t => t.crew || []);
  const people = mergeCrew(source).map(c => c.name).sort((a, b) => a.localeCompare(b));
  const me = personKey(S.pickName), listed = people.some(n => personKey(n) === me);
  const nameSel = h("select", { "data-k": "dname", class: "namesel", onchange: e => { S.pickName = e.target.value; render(); } },
    h("option", { value: "", selected: !S.pickName }, "Choose your name…"),
    people.map(n => h("option", { value: n, selected: !!me && personKey(n) === me }, n)),
    S.pickName && !listed ? h("option", { value: S.pickName, selected: true }, S.pickName) : null);
  return h("div", { class: "pick" },
    S.me ? h("div", { class: "card mebar" },
        h("div", { class: "rb" }, h("div", null, h("div", { class: "meta" }, "Signed in as"), h("b", { style: { fontSize: "19px" } }, S.me.name), S.me.admin ? h("span", { class: "chip", style: { marginLeft: "8px" } }, "Office") : null),
          h("button", { type: "button", class: "small", onclick: () => { S.si = { active: true, name: "", secret: "", msg: "" }; render(); } }, "Switch driver")),
        S.pinSaved ? h("div", { class: "hint picked" }, "✓ PIN saved. Now tap the truck you're on today.")
          : S.me.admin ? null : h("button", { type: "button", class: "linkbtn", onclick: () => { S.np = { active: true, first: false, p1: "", p2: "", msg: "" }; render(); } }, "Change my PIN"))
    : [h("label", { class: "f pick-name" }, "Who are you?", nameSel),
       S.pickName ? h("div", { class: "hint picked" }, `✓ Hi ${firstName(S.pickName)} — your scans will show your name. Now tap the truck you're on today.`)
         : h("div", { class: "hint" }, "Pick your name so the office knows who scanned.")],
    h("h2", { class: "pick-q" }, "Which truck are you on?"),
    h("div", { class: "trucks" }, trucks.map(t => {
      const last = t.code === S.lastTruck;
      return h("button", { type: "button", class: "truck" + (last ? " last" : ""), onclick: () => start(t.code) },
        h("span", { class: "tcode" }, t.code),
        h("span", { class: "tinfo" },
          h("span", { class: "tname" }, t.nickname || `Truck ${t.code}`),
          last ? h("span", { class: "chip ok tlast" }, "Last used") : null),
        h("span", { class: "tgo", "aria-hidden": "true" }, "›"));
    })),
    S.other
      ? h("form", { class: "manual", onsubmit: e => { e.preventDefault(); start(S.pick); } },
          h("input", { "data-k": "truck", value: S.pick, placeholder: "Truck name", autocapitalize: "characters", spellcheck: "false", style: { textTransform: "uppercase" },
            oninput: e => { S.pick = e.target.value; } }), h("button", { class: "primary" }, "Go"))
      : h("button", { type: "button", class: "linkbtn", onclick: () => { S.other = true; render(); } }, "Truck not listed?"),
    h("div", { class: "hint" }, "Open the app once with internet each morning so your run downloads — then it works offline."),
    h("div", { class: "pick-sep" }),
    h("a", { class: "btn big office", href: "admin.html#office" }, "🔒  Office / Admin"));
}

/* ---------------- manifest list ---------------- */
function listView() {
  const ms = S.manifests.filter(m => m.status !== "archived")
    .sort((a, b) => (a.status === "done") - (b.status === "done") || String(b.date || "").localeCompare(String(a.date || "")) || (b.createdAt || 0) - (a.createdAt || 0));
  return h("div", null,
    h("a", { class: "back", href: "#" }, "← Change name or truck"),
    h("h2", { class: "title" }, `${S.driver.truck}${S.driver.name ? ` · ${firstName(S.driver.name)}` : ""}`),
    ms.length ? ms.map(m => {
      const stops = (m.stops || []).length, done = (m.stops || []).filter(s => stopIsDone(m, s.id)).length;
      return h("a", { class: "card", href: `#/m/${encodeURIComponent(m.id)}` },
        h("div", { class: "rb" }, h("b", { style: { fontSize: "18px" } }, runTitle(m)),
          m.status === "done" ? h("span", { class: "chip ok" }, "Done") : done ? h("span", { class: "chip warn" }, "In progress") : h("span", { class: "chip" }, "New")),
        h("div", { class: "meta" }, [plural(stops, "stop"), plural(packageCount(m), "package"), crewNames(m)].filter(Boolean).join(" · ")),
        manifestNos(m).length ? h("div", { class: "meta" }, `Manifest${manifestNos(m).length > 1 ? "s" : ""} ${manifestNos(m).join(", ")}`) : null,
        h("div", { class: "bar" }, h("i", { style: { width: `${stops ? (done / stops) * 100 : 0}%` } })),
        h("div", { class: "meta", style: { marginTop: "6px" } }, `${done} of ${stops} stops finished`));
    }) : h("div", { class: "card empty" }, `Nothing for ${S.driver.truck} yet. Runs show up here when the office sends them. Open the app while you have internet to download them.`));
}

/* ---------------- one manifest: its stops ---------------- */
function manifestView() {
  const m = S.manifest, sum = withLocal(summarize(m, S.scans));
  return h("div", null,
    h("a", { class: "back", href: "#/" }, "← All runs"),
    h("div", { class: "card" },
      h("div", { class: "rb" }, h("b", { style: { fontSize: "18px" } }, runTitle(m)), crewCount(m) ? h("span", { class: "meta" }, crewNames(m)) : null),
      h("div", { class: "meta" }, `${sum.done} of ${plural(sum.total, "package")} scanned`),
      h("div", { class: "bar" }, h("i", { style: { width: `${sum.total ? (sum.done / sum.total) * 100 : 0}%` } })),
      S.pending ? h("div", { class: "hint" }, `${plural(S.pending, "scan")} waiting to upload. They'll send by themselves when you're back online.`) : null),
    loadCard(m),
    (m.stops || []).map((s, i) => {
      const p = sum.per[s.id], n = s.packages.length, got = p.matched.size, done = stopIsDone(m, s.id), issues = uniqIssues(p.issues).length;
      return h("a", { class: "card" + (done ? " stop-done" : ""), href: `#/m/${encodeURIComponent(m.id)}/s/${encodeURIComponent(s.id)}` },
        h("div", { style: { display: "flex", gap: "12px", alignItems: "center" } },
          h("div", { class: "stopno" }, done ? "✓" : String(i + 1)),
          h("div", { style: { flex: 1, minWidth: 0 } },
            h("div", { class: "rb" }, h("b", null, s.name), done ? h("span", { class: "chip ok" }, "Finished") : null),
            h("div", { class: "meta" }, s.address || s.license),
            stopSets(s).map(x => h("div", { class: "meta" }, setText(x))),
            h("div", { class: "meta" }, `${got} of ${n} scanned`, issues ? h("span", { class: "chip bad", style: { marginLeft: "8px" } }, plural(issues, "problem")) : null))),
        h("div", { class: "bar" }, h("i", { style: { width: `${n ? (got / n) * 100 : 0}%` } })));
    }));
}

/* ---------------- one stop: scanning ---------------- */
function stopView(stop) {
  const m = S.manifest, sum = withLocal(summarize(m, S.scans)), per = sum.per[stop.id];
  const idx = m.stops.indexOf(stop), done = stopIsDone(m, stop.id);
  const scanned = stop.packages.filter(p => per.matched.has(p.tag)), todo = stop.packages.filter(p => !per.matched.has(p.tag));
  const issues = uniqIssues(per.issues);
  const multi = multiOrigin(stop);
  // two facilities = two "Box 1"s, so list each facility's boxes under its own heading
  const grouped = list => !multi ? list.map(p => row(p, false)) : stopSets(stop).map(x => {
    const mine = list.filter(p => p.origin === x.origin);
    return mine.length ? [h("div", { class: "grp" }, `From ${x.origin}${x.invoiceNo ? ` · WTI ${x.invoiceNo}` : ""}`), mine.map(p => row(p, false))] : null;
  }).concat([list.filter(p => !stopSets(stop).some(x => x.origin === p.origin)).map(p => row(p, false))]);
  const row = (p, ok) => {
    const sc = ok && per.matched.get(p.tag);
    return h("div", { class: "pkg" + (ok ? " done" : "") + (S.store.demo && !ok ? " tapme" : ""), onclick: S.store.demo && !ok ? () => handleCode(p.tag, stop.id, "tap") : null },
      h("div", { class: "ic" }, ok ? "✓" : p.box || ""),
      h("div", { class: "main" },
        h("div", { class: "name" }, p.item || "(no item name)"),
        h("div", { class: "meta" }, [boxLabel(p, multi), fmtQty(p), p.batch && `Batch ${p.batch}`].filter(Boolean).join(" · ")),
        tagNode(p.tag),
        sc && sc.at ? h("div", { class: "meta" }, `Scanned ${fmtTime(sc.at)}${sc.driverName ? ` by ${firstName(sc.driverName)}` : ""}`) : null));
  };
  return h("div", null,
    h("a", { class: "back", href: `#/m/${encodeURIComponent(m.id)}` }, `← ${runTitle(m)}`),
    h("div", { class: "card" },
      h("div", { class: "meta" }, `Stop ${idx + 1} of ${m.stops.length}`),
      h("div", { style: { fontSize: "20px", fontWeight: 800 } }, stop.name),
      h("div", { class: "meta" }, [stop.address, stop.license].filter(Boolean).join(" · ")),
      stopSets(stop).map(x => h("div", { class: "meta" }, setText(x))),
      h("div", { class: "rb", style: { marginTop: "8px" } }, h("b", null, `${scanned.length} of ${stop.packages.length} scanned`), done ? h("span", { class: "chip ok" }, "Finished") : null),
      h("div", { class: "bar" }, h("i", { style: { width: `${stop.packages.length ? (scanned.length / stop.packages.length) * 100 : 0}%` } })),
      h("div", { style: { marginTop: "14px" } }, h("button", { class: "primary big", onclick: () => openCamera(stop) }, "📷  Scan packages")),
      h("form", { class: "manual", onsubmit: e => { e.preventDefault(); if (S.code.trim()) { handleCode(S.code, stop.id, "typed"); S.code = ""; render(); } } },
        h("input", { "data-k": "code", value: S.code, oninput: e => { S.code = e.target.value; }, placeholder: "Type a tag", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", enterkeyhint: "go" }),
        h("button", null, "Check")),
      h("div", { class: "hint" }, "Bluetooth scanner: just scan — it works whenever this screen is open.")),
    S.last && S.last.stopId === stop.id ? resultCard(S.last) : null,
    issues.length ? h("div", { class: "card" }, h("h3", { style: { marginTop: 0 } }, `Problems at this stop (${issues.length})`),
      issues.map(sc => h("div", { class: "pkg issue" }, h("div", { class: "ic" }, "!"),
        h("div", { class: "main" }, h("div", { class: "name" }, sc.result === "wrong_stop" ? `Belongs to ${stopLabel(sc.otherStopId)}` : "Not on this manifest"),
          infoFor(sc.tag) ? h("div", { class: "meta" }, infoFor(sc.tag).item) : null, tagNode(sc.tag))))) : null,
    h("h3", null, `To scan (${todo.length})`),
    h("div", { class: "card" }, todo.length ? grouped(todo) : h("div", { class: "empty" }, "Everything at this stop is scanned. 🎉")),
    scanned.length ? [h("h3", null, `Scanned (${scanned.length})`), h("div", { class: "card" }, scanned.map(p => row(p, true)),
      h("button", { class: "small", style: { marginTop: "10px" }, onclick: e => copyTags(scanned.map(p => p.tag), e.currentTarget) }, `Copy scanned tags (${scanned.length})`))] : null,
    h("div", { style: { margin: "6px 0 30px" } }, done
      ? h("button", { class: "big", onclick: () => { S.store.setStopDone(m.id, stop.id, null, "in_progress"); } }, "Reopen this stop")
      : h("button", { class: todo.length ? "big" : "primary big", onclick: () => finishStop(stop, todo) }, todo.length ? `Finish stop (${todo.length} not scanned)` : "✓ Finish this stop")));
}

function resultCard(r) {
  const R = RESULT[r.result], p = r.pkg, isLoad = r.stopId === LOAD;
  const title = !isLoad ? R.title : r.result === "match" ? "✓ Loaded" : r.result === "duplicate" ? "Already loaded" : "✗ Not on this run";
  const sub = isLoad ? (r.result === "match" ? `For ${stopLabel(r.forStopId)}` : r.result === "duplicate" ? "This package was already counted as loaded." : "This tag isn't on this run. Don't load it.")
    : r.result === "wrong_stop" ? `This package is for ${stopLabel(r.otherStopId)}. Don't leave it here.`
    : r.result === "not_on_manifest" ? "This tag isn't on this manifest. Don't leave it here."
    : r.result === "duplicate" ? "This package was already counted." : "";
  return h("div", { class: `result ${R.tone}`, role: "status", "aria-live": "polite" },
    h("div", { class: "rb" }, h("div", { class: "rh" }, title), h("span", { class: "meta" }, fmtTime(r.at))),
    sub ? h("div", { class: "rs" }, sub) : null,
    p ? [p.box ? h("div", { class: "bigbox" }, `Box # ${p.box}`) : null,
      p.box && p.origin && S.manifest && (S.manifest.stops || []).some(s => s.id === (r.forStopId || r.stopId) && multiOrigin(s)) ? h("div", { class: "boxfrom" }, `from ${p.origin}`) : null,
      h("div", { class: "ri" }, p.item || "(no item name)"),
      h("div", { class: "rg" }, h("div", null, h("span", null, "Quantity / weight"), h("b", null, fmtQty(p) || "—")), h("div", null, h("span", null, "Batch"), h("b", null, p.batch || "—")))] : null,
    tagNode(r.tag));
}

/* ---------------- checking a tag ---------------- */
function handleCode(raw, stopId, via, fromCamera = false) {
  const m = S.manifest; if (!m || !S.driver) return null;
  const tag = normalizeTag(raw); if (!tag) return null;
  if (stopId === LOAD) return handleLoad(m, tag, raw, via, fromCamera);
  const sum = withLocal(summarize(m, S.scans)), hit = sum.byTag.get(tag);
  let local = S.local.get(stopId); if (!local) S.local.set(stopId, local = new Set());
  let result;
  if (!hit) result = "not_on_manifest";
  else if (hit.stop.id !== stopId) result = "wrong_stop";
  else if (sum.per[stopId].matched.has(tag)) result = "duplicate";
  else { result = "match"; local.add(tag); }
  const scan = { tag, stopId, result, at: Date.now(), via, truck: m.truck || S.driver.truck, driverName: S.driver.name || "" };
  if (result === "wrong_stop") scan.otherStopId = hit.stop.id;
  if (String(raw).trim().toUpperCase() !== tag) scan.raw = String(raw).slice(0, 200);
  S.store.addScan(m.id, scan);
  S.last = { ...scan, pkg: hit && hit.pkg };
  if (!fromCamera) signal(RESULT[result].tone);
  render();
  return S.last;
}
// Counts tags scanned on this phone that the database hasn't echoed back yet (prevents double counting fast scans).
function withLocal(sum) {
  for (const [sid, set] of S.local) { const p = sum.per[sid]; if (p) for (const t of set) if (!p.matched.has(t)) { p.matched.set(t, { tag: t }); sum.done++; } }
  return sum;
}
const uniqIssues = list => [...new Map(list.map(s => [s.tag, s])).values()];
const infoFor = tag => { const m = S.manifest; for (const s of (m && m.stops) || []) for (const p of s.packages) if (p.tag === tag) return p; return null; };
function stopLabel(id) { const m = S.manifest, i = (m.stops || []).findIndex(s => s.id === id); return i < 0 ? "another stop" : `stop ${i + 1}: ${m.stops[i].name}`; }

function openCamera(stop) {
  const stopNo = S.manifest.stops.indexOf(stop) + 1;
  scanMany({ title: `Stop ${stopNo}: ${stop.name}`, formats: FORMATS, manualNumeric: false, manualPlaceholder: "Or type the tag",
    hint: "Point at each package's Metrc tag. It reads by itself.",
    onDetect: hit => {
      const r = handleCode(hit.code, stop.id, hit.source === "typed" ? "typed" : "camera", true);
      if (!r) return null;
      const R = RESULT[r.result], p = r.pkg;
      const per = withLocal(summarize(S.manifest, S.scans)).per[stop.id];
      return { tone: R.tone,
        title: r.result === "wrong_stop" ? `${R.title} — ${stopLabel(r.otherStopId)}` : `${R.title}${p && p.box ? `  ·  ${multiOrigin(stop) && p.originShort ? p.originShort + " " : ""}Box # ${p.box}` : ""}  (${per.matched.size}/${stop.packages.length})`,
        lines: p ? [p.item || "(no item name)", [fmtQty(p), p.batch && `Batch ${p.batch}`].filter(Boolean).join(" · "), r.tag] : [r.tag] };
    } });
}

// Like the old sheet tool: every scanned tag, one per line, ready to paste into Metrc.
async function copyTags(tags, btn) {
  const text = tags.join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = h("textarea", { style: { position: "fixed", opacity: "0" } }, text); document.body.append(t); t.select(); try { document.execCommand("copy"); } catch (e2) {} t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = `✓ Copied ${plural(tags.length, "tag")}`; setTimeout(() => { btn.textContent = old; }, 1800); }
}

function finishStop(stop, todo) {
  if (todo.length && !confirm(`${plural(todo.length, "package")} at this stop ${todo.length > 1 ? "haven't" : "hasn't"} been scanned. Finish the stop anyway? The office will see what was missing.`)) return;
  const m = S.manifest, doneNow = { ...(m.stopsDone || {}), [stop.id]: true };
  const all = m.stops.every(s => doneNow[s.id]);
  S.store.setStopDone(m.id, stop.id, { at: Date.now(), missing: todo.map(p => p.tag), by: S.driver.name || S.driver.truck }, all ? "done" : "in_progress");
  S.last = null;
  location.hash = `#/m/${encodeURIComponent(m.id)}`;
}

/* ---------------- load check: scan every package onto the truck before it leaves ---------------- */
function loadCard(m) {
  const L = loadSummary(m, S.scans, S.local.get(LOAD)), n = L.loaded.size, miss = L.done && (L.done.missing || []).length;
  return h("a", { class: "card loadcard" + (L.done ? " stop-done" : ""), href: `#/m/${encodeURIComponent(m.id)}/s/${LOAD}` },
    h("div", { style: { display: "flex", gap: "12px", alignItems: "center" } },
      h("div", { class: "stopno" }, L.done ? "✓" : "📦"),
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { class: "rb" }, h("b", null, "Load check"),
          L.done ? h("span", { class: miss ? "chip warn" : "chip ok" }, miss ? `${miss} not loaded` : "All loaded") : h("span", { class: "chip" }, `${n}/${L.total}`)),
        h("div", { class: "meta" }, L.done ? `Finished ${fmtTime(L.done.at)}${L.done.by ? ` by ${firstName(L.done.by)}` : ""}` : "Before you leave: scan every package onto the truck."))),
    h("div", { class: "bar" }, h("i", { style: { width: `${L.total ? (n / L.total) * 100 : 0}%` } })));
}
function loadView() {
  const m = S.manifest, L = loadSummary(m, S.scans, S.local.get(LOAD));
  const left = (m.stops || []).map((s, i) => ({ s, i, list: s.packages.filter(p => !L.loaded.has(p.tag)) })).filter(x => x.list.length);
  const nLeft = L.total - L.loaded.size;
  const row = (p, s) => h("div", { class: "pkg" + (S.store.demo ? " tapme" : ""), onclick: S.store.demo ? () => handleCode(p.tag, LOAD, "tap") : null },
    h("div", { class: "ic" }, p.box || ""),
    h("div", { class: "main" }, h("div", { class: "name" }, p.item || "(no item name)"),
      h("div", { class: "meta" }, [boxLabel(p, multiOrigin(s)), fmtQty(p)].filter(Boolean).join(" · ")), tagNode(p.tag)));
  return h("div", null,
    h("a", { class: "back", href: `#/m/${encodeURIComponent(m.id)}` }, `← ${runTitle(m)}`),
    h("div", { class: "card" },
      h("div", { class: "meta" }, "At the dock, before the truck leaves"),
      h("div", { style: { fontSize: "20px", fontWeight: 800 } }, "📦 Load check"),
      h("div", { class: "rb", style: { marginTop: "8px" } }, h("b", null, `${L.loaded.size} of ${plural(L.total, "package")} loaded`),
        L.done ? h("span", { class: "chip ok" }, "Finished") : null),
      h("div", { class: "bar" }, h("i", { style: { width: `${L.total ? (L.loaded.size / L.total) * 100 : 0}%` } })),
      h("div", { style: { marginTop: "14px" } }, h("button", { class: "primary big", onclick: openLoadCamera }, "📷  Scan packages")),
      h("form", { class: "manual", onsubmit: e => { e.preventDefault(); if (S.code.trim()) { handleCode(S.code, LOAD, "typed"); S.code = ""; render(); } } },
        h("input", { "data-k": "code", value: S.code, oninput: e => { S.code = e.target.value; }, placeholder: "Type a tag", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", enterkeyhint: "go" }),
        h("button", null, "Check")),
      h("div", { class: "hint" }, "Scan in any order. Bluetooth scanner: just scan — it works whenever this screen is open.")),
    S.last && S.last.stopId === LOAD ? resultCard(S.last) : null,
    L.extras.length ? h("div", { class: "card" }, h("h3", { style: { marginTop: 0, color: "var(--bad)" } }, `Not on this run (${L.extras.length}) — take off the truck`),
      L.extras.map(sc => h("div", { class: "pkg issue" }, h("div", { class: "ic" }, "!"), h("div", { class: "main" }, h("div", { class: "name" }, "Not on this run"), tagNode(sc.tag))))) : null,
    h("h3", null, `Not loaded yet (${nLeft})`),
    h("div", { class: "card" }, left.length ? left.map(x => [h("div", { class: "grp" }, `Stop ${x.i + 1}: ${x.s.name} · ${x.list.length} left`), x.list.map(p => row(p, x.s))])
      : h("div", { class: "empty" }, "Everything is on the truck. 🎉")),
    h("div", { style: { margin: "6px 0 30px" } }, L.done
      ? h("button", { class: "big", onclick: () => S.store.setStopDone(m.id, LOAD, null, m.status) }, "Redo the load check")
      : h("button", { class: nLeft ? "big" : "primary big", onclick: () => finishLoad(m, L, nLeft) }, nLeft ? `Done loading (${nLeft} not loaded)` : "✓ Done loading")));
}
function handleLoad(m, tag, raw, via, fromCamera) {
  const L = loadSummary(m, S.scans, S.local.get(LOAD)), hit = L.byTag.get(tag);
  let local = S.local.get(LOAD); if (!local) S.local.set(LOAD, local = new Set());
  let result;
  if (!hit) result = "not_on_manifest";
  else if (L.loaded.has(tag)) result = "duplicate";
  else { result = "match"; local.add(tag); }
  const scan = { tag, stopId: LOAD, result, at: Date.now(), via, truck: m.truck || S.driver.truck, driverName: S.driver.name || "" };
  if (String(raw).trim().toUpperCase() !== tag) scan.raw = String(raw).slice(0, 200);
  S.store.addScan(m.id, scan);
  S.last = { ...scan, pkg: hit && hit.pkg, forStopId: hit && hit.stop.id };
  if (!fromCamera) signal(RESULT[result].tone);
  render();
  return S.last;
}
function openLoadCamera() {
  const m = S.manifest;
  scanMany({ title: `Load check · ${runTitle(m)}`, formats: FORMATS, manualNumeric: false, manualPlaceholder: "Or type the tag",
    hint: "Scan every package as it goes on the truck.",
    onDetect: hit => {
      const r = handleCode(hit.code, LOAD, hit.source === "typed" ? "typed" : "camera", true);
      if (!r) return null;
      const L = loadSummary(m, S.scans, S.local.get(LOAD)), p = r.pkg, i = p ? m.stops.findIndex(s => s.id === r.forStopId) : -1;
      const title = r.result === "match" ? `✓ Loaded · Stop ${i + 1}${p.box ? ` · ${multiOrigin(m.stops[i]) && p.originShort ? p.originShort + " " : ""}Box # ${p.box}` : ""}  (${L.loaded.size}/${L.total})`
        : r.result === "duplicate" ? `Already loaded  (${L.loaded.size}/${L.total})` : "✗ Not on this run — don't load it";
      return { tone: RESULT[r.result].tone, title, lines: p ? [p.item || "(no item name)", m.stops[i].name, r.tag] : [r.tag] };
    } });
}
function finishLoad(m, L, nLeft) {
  if (nLeft && !confirm(`${plural(nLeft, "package")} ${nLeft > 1 ? "aren't" : "isn't"} loaded. Finish anyway? The office will see what's missing.`)) return;
  const missing = (m.stops || []).flatMap(s => s.packages.filter(p => !L.loaded.has(p.tag)).map(p => p.tag));
  S.store.setStopDone(m.id, LOAD, { at: Date.now(), missing, loaded: L.loaded.size, by: S.driver.name || S.driver.truck }, m.status === "assigned" ? "assigned" : m.status);
  S.last = null;
  location.hash = `#/m/${encodeURIComponent(m.id)}`;
}

/* ---------------- Bluetooth / USB scanners (they type the code and press Enter) ---------------- */
let buf = "", lastKey = 0;
document.addEventListener("keydown", e => {
  if (document.querySelector(".bcs-scrim")) return;               // the camera screen has its own box
  const t = e.target; if (t && t.matches && t.matches("input, textarea, select")) return;
  const { sid } = route(); if (!sid || !S.manifest) return;
  const now = performance.now();
  if (now - lastKey > 120) buf = "";
  lastKey = now;
  if (e.key === "Enter" || e.key === "Tab") { if (buf.length >= 6) { e.preventDefault(); handleCode(buf, sid, "scanner"); } buf = ""; return; }
  if (e.key && e.key.length === 1) buf += e.key;
});
</script>
</body>
